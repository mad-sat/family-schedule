<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f7fb"><title>わが家の予定表</title><style>
:root{--ink:#202331;--muted:#6f7485;--line:#e4e7ef;--primary:#6658e8;--green:#16866f;--danger:#c34655;--shadow:0 10px 30px rgba(35,39,70,.08);font-family:system-ui,-apple-system,"Segoe UI","Noto Sans JP",sans-serif}*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#f8f5ff,#f4f8fb 45%,#f8fbf5);color:var(--ink);min-height:100vh}button,input{font:inherit}button{cursor:pointer}.wrap{width:min(1050px,calc(100% - 28px));margin:auto;padding:28px 0 70px}header{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;margin:4px 0 22px}.eyebrow{color:var(--primary);font-weight:800;font-size:.78rem;letter-spacing:.12em}.title{font-size:clamp(1.75rem,5vw,2.6rem);margin:.2rem 0}.sub,.hint{color:var(--muted);font-size:.9rem}.status{font-size:.8rem;color:var(--green);font-weight:700}.actions{display:flex;gap:8px}.btn{border:1px solid var(--line);background:#fff;padding:10px 13px;border-radius:12px;font-weight:700}.danger{color:var(--danger)}.grid{display:grid;grid-template-columns:.82fr 1.18fr;gap:18px}.card{background:#fffffff0;border:1px solid #e0e1ec;border-radius:22px;padding:20px;box-shadow:var(--shadow)}.cardhead{display:flex;gap:11px;align-items:center;margin-bottom:16px}.icon{width:40px;height:40px;display:grid;place-items:center;border-radius:13px;background:#eeeaff}.entry{position:relative;display:flex;gap:8px}.entry input{width:100%;min-width:0;border:1px solid var(--line);border-radius:13px;padding:12px 13px}.add{border:0;border-radius:12px;padding:0 16px;background:var(--ink);color:white;font-weight:800}.suggest{position:absolute;display:none;z-index:10;top:calc(100% + 6px);left:0;right:62px;max-height:220px;overflow:auto;background:white;border:1px solid var(--line);border-radius:13px;box-shadow:0 15px 35px #1c1f3729;padding:5px}.suggest.show{display:block}.suggest button{width:100%;border:0;background:transparent;padding:10px;text-align:left;border-radius:9px}.items{list-style:none;padding:0;margin:14px 0 0;display:flex;flex-wrap:wrap;gap:8px}.chip{display:flex;align-items:center;gap:7px;background:#f1efff;border-radius:999px;padding:7px 8px 7px 12px}.chip label{display:flex;gap:7px;align-items:center}.chip input{width:18px;height:18px;accent-color:var(--green)}.chip.done{opacity:.7}.chip.done span{text-decoration:line-through}.chip button{border:0;background:white;border-radius:50%;width:23px;height:23px}.days{display:grid;gap:11px}.day{background:#fafbfe;border:1px solid var(--line);border-radius:16px;padding:13px}.daytop{display:flex;justify-content:space-between;margin-bottom:9px}.dayname{font-weight:900}.count,.empty{font-size:.8rem;color:var(--muted)}.day .chip{background:#eaf7f3}footer{text-align:center;color:var(--muted);font-size:.78rem;margin-top:18px}.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:#202331;color:#fff;padding:11px 16px;border-radius:999px;opacity:0;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:760px){.grid{grid-template-columns:1fr}header{align-items:flex-start;flex-direction:column}}
</style></head><body><div class="wrap"><header><div><div class="eyebrow">FAMILY WEEKLY BOARD</div><h1 class="title">わが家の予定表</h1><p class="sub" id="weekText"></p><span class="status" id="syncStatus">読込中…</span></div><div class="actions"><button class="btn" id="reloadBtn">再読込</button><button class="btn danger" id="clearBtn">全消去</button></div></header><main class="grid"><section class="card"><div class="cardhead"><div class="icon">🛒</div><div><h2>今週の買い物</h2><div class="hint">候補選択または自由入力。家族全員に共有されます</div></div></div><div id="shoppingEntry"></div><ul id="shoppingItems" class="items"></ul></section><section class="card"><div class="cardhead"><div class="icon">🍽️</div><div><h2>月〜金の夕飯</h2><div class="hint">各曜日に何件でも追加できます</div></div></div><div id="days" class="days"></div></section></main><footer>入力内容は Google Apps Script 経由で家族共通データとして保存されます</footer></div><div class="toast" id="toast"></div>
<script>'use strict';
const API_URL='https://script.google.com/macros/s/AKfycbxaQz-TL4Dt2JqotIDwVlvFgHynWT88PxAAo154psrhsVzMKLpnlm6F9sW2HXSnl0zj/exec';
const SHOP_DEFAULT=['トイレットペーパー','トイレ消臭剤','ティッシュペーパー','キッチンペーパー','洗濯洗剤','食器用洗剤','柔軟剤','シャンプー','牛乳','卵','食パン','米','水','お茶','コーヒー','ヨーグルト','バナナ','りんご','玉ねぎ','にんじん','じゃがいも','キャベツ','レタス','トマト','鶏肉','豚肉','ひき肉','鮭','豆腐','納豆','冷凍食品'];
const MEAL_DEFAULT=['鶏のから揚げ','照り焼きチキン','親子丼','カレーライス','ハンバーグ','豚の生姜焼き','肉じゃが','麻婆豆腐','焼き魚','鮭のホイル焼き','冷凍餃子','焼き餃子','チャーハン','オムライス','焼きそば','うどん','そば','ラーメン','パスタ','鍋','シチュー','グラタン','サラダ','味噌汁','スープ','コロッケ','とんかつ'];
const DAYS=[['mon','月曜日'],['tue','火曜日'],['wed','水曜日'],['thu','木曜日'],['fri','金曜日']];
const blank=()=>({shopping:[],meals:{mon:[],tue:[],wed:[],thu:[],fri:[]},customShop:[],customMeal:[]});let state=blank(),saving=false;
function normalize(v){const b=blank();const cv=a=>Array.isArray(a)?a.map(x=>typeof x==='string'?{text:x,done:false}:{text:String(x.text??''),done:!!x.done}).filter(x=>x.text):[];b.shopping=cv(v?.shopping);for(const[d]of DAYS)b.meals[d]=cv(v?.meals?.[d]);b.customShop=Array.isArray(v?.customShop)?v.customShop:[];b.customMeal=Array.isArray(v?.customMeal)?v.customMeal:[];return b}
function load(){
  sync('読込中…');
  const callbackName='familyScheduleCallback_'+Date.now();
  const script=document.createElement('script');
  let finished=false;
  const cleanup=()=>{if(finished)return;finished=true;delete window[callbackName];script.remove()};
  window[callbackName]=function(data){
    try{state=normalize(data);render();sync('同期済み')}catch(e){sync('読込エラー');toast('データを読み込めませんでした')}finally{cleanup()}
  };
  script.src=API_URL+'?callback='+encodeURIComponent(callbackName)+'&t='+Date.now();
  script.onerror=function(){sync('読込エラー');toast('データを読み込めませんでした');cleanup()};
  document.body.appendChild(script);
}
async function save(){
  if(saving)return;
  saving=true;sync('保存中…');
  try{
    await fetch(API_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(state)});
    sync('保存済み');
    setTimeout(load,1200);
  }catch(e){sync('保存エラー');toast('保存できませんでした')}finally{saving=false}
}
function sync(s){document.getElementById('syncStatus').textContent=s}function norm(s){return s.trim().toLocaleLowerCase('ja')}function filtered(a,q){q=norm(q);return a.filter(x=>!q||norm(x).includes(q)).slice(0,12)}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function entry(target,type){const box=document.createElement('div');box.className='entry';box.innerHTML='<input autocomplete="off" placeholder="例：ト、鶏、れ…"><div class="suggest"></div><button class="add">追加</button>';const input=box.querySelector('input'),sg=box.querySelector('.suggest');const source=()=>[...new Set(type==='shop'?[...state.customShop,...SHOP_DEFAULT]:[...state.customMeal,...MEAL_DEFAULT])];function show(){const a=filtered(source(),input.value);sg.innerHTML=a.length?a.map(x=>`<button type="button" data-v="${esc(x)}">${esc(x)}</button>`).join(''):'<div class="empty">候補なし。そのまま追加できます</div>';sg.classList.add('show')}async function add(v=input.value){v=v.trim();if(!v||target.some(x=>x.text===v))return;target.push({text:v,done:false});const c=type==='shop'?state.customShop:state.customMeal;if(!source().includes(v))c.unshift(v);input.value='';sg.classList.remove('show');render();await save()}input.oninput=show;input.onfocus=show;input.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();add()}};sg.onmousedown=e=>{const b=e.target.closest('button');if(b)add(b.dataset.v)};box.querySelector('.add').onclick=()=>add();return box}
function chips(el,a){el.innerHTML=a.length?a.map((x,i)=>`<li class="chip ${x.done?'done':''}"><label><input type="checkbox" data-c="${i}" ${x.done?'checked':''}><span>${esc(x.text)}</span></label><button data-d="${i}">×</button></li>`).join(''):'<li class="empty">まだ登録されていません</li>';el.onchange=e=>{if(e.target.dataset.c!==undefined){a[+e.target.dataset.c].done=e.target.checked;render();save()}};el.onclick=e=>{const b=e.target.closest('[data-d]');if(b){a.splice(+b.dataset.d,1);render();save()}}}
function render(){const se=document.getElementById('shoppingEntry');se.innerHTML='';se.append(entry(state.shopping,'shop'));chips(document.getElementById('shoppingItems'),state.shopping);const ds=document.getElementById('days');ds.innerHTML='';DAYS.forEach(([id,n])=>{const d=document.createElement('section');d.className='day';d.innerHTML=`<div class="daytop"><span class="dayname">${n}</span><span class="count">${state.meals[id].filter(x=>!x.done).length}件 未完了</span></div><div class="slot"></div><ul class="items"></ul>`;d.querySelector('.slot').append(entry(state.meals[id],'meal'));chips(d.querySelector('.items'),state.meals[id]);ds.append(d)})}
function weekLabel(){const n=new Date(),day=n.getDay()||7,m=new Date(n);m.setDate(n.getDate()-day+1);const f=new Date(m);f.setDate(m.getDate()+4);const x=d=>`${d.getMonth()+1}月${d.getDate()}日`;document.getElementById('weekText').textContent=`${x(m)} 〜 ${x(f)} の予定`}let timer;function toast(s){const t=document.getElementById('toast');t.textContent=s;t.classList.add('show');clearTimeout(timer);timer=setTimeout(()=>t.classList.remove('show'),1800)}
document.getElementById('reloadBtn').onclick=load;document.getElementById('clearBtn').onclick=()=>{if(confirm('全データを消去しますか？')){state=blank();render();save()}};weekLabel();render();load();setInterval(load,15000);
</script></body></html>
